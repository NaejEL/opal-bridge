name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all shell scripts
        run: |
          set -e
          for f in build.sh ipk/postinst ipk/prerm ipk/postrm \
                   files/usr/bin/opal-mode files/usr/bin/opal-led \
                   files/usr/lib/opal-bridge/setup-mdns \
                   files/etc/init.d/opal-mode \
                   files/etc/gl-switch.d/bridgemode.sh \
                   files/etc/hotplug.d/iface/99-relayd-bridge; do
            sh -n "$f" && echo "OK $f"
          done

      - name: Build ipk
        run: sh build.sh

      - name: Check tag matches control version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(sed -n 's/^Version: //p' ipk/control)
          TAG=${GITHUB_REF#refs/tags/v}
          [ "$TAG" = "$VER" ] || [ "$TAG" = "${VER%-*}" ] || {
            echo "tag v$TAG does not match ipk/control Version: $VER"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opal-bridge-ipk
          path: build/*.ipk

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipk
          generate_release_notes: true
